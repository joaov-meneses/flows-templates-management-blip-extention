<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teste de indisponibilidade do Portal</title>
  </head>
  <body style="margin: 0">
    <button id="recover" type="button">Simular recuperação do Portal</button>
    <iframe
      title="Extensão sem conexão com o Portal"
      src="http://localhost:8080"
      style="width: 100%; height: 100vh; border: 0"
    ></iframe>
    <script>
      let respond = false;
      document.getElementById("recover").onclick = () => {
        respond = true;
      };
      window.addEventListener("message", (event) => {
        const frame = document.querySelector("iframe");
        if (
          !respond ||
          event.origin !== "http://localhost:8080" ||
          event.source !== frame.contentWindow
        )
          return;
        if (event.data?.message?.action !== "blipEvent:getApplication") return;
        event.source.postMessage(
          {
            trackingProperties: event.data.trackingProperties,
            response: { shortName: "router_teste", name: "Router de teste local" },
          },
          event.origin,
        );
      });
    </script>
  </body>
</html>
