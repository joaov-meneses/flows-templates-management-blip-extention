<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inatividade · dados fictícios</title>
  </head>
  <body style="margin: 0">
    <p style="margin: 0; padding: 8px; font: 13px system-ui">
      Validação local · bots e rascunhos fictícios
      <output id="fixture-operations">0 salvamentos · 0 publicações</output>
      <label>
        Conta fictícia:
        <select id="fixture-account">
          <option value="publisher@example.com">publisher@example.com</option>
          <option value="other@example.com">other@example.com</option>
          <option value="">Sem e-mail</option>
        </select>
      </label>
      <label>
        Public key fictícia:
        <select id="fixture-public-key">
          <option value="per-router">Por router (origem e com_chave cadastrados)</option>
          <option value="present">Cadastrada</option>
          <option value="missing">Ausente</option>
          <option value="error">Falha de consulta</option>
        </select>
      </label>
      <output id="fixture-key-checks">0 consultas de public key</output>
    </p>
    <iframe
      title="Extensão com dados fictícios"
      src="/inactivity-app.html"
      style="width: 100%; height: 900px; border: 0"
    ></iframe>
    <dialog
      aria-labelledby="fixture-alert-title"
      style="
        max-width: 440px;
        border: 0;
        border-radius: 8px;
        padding: 24px;
        font: 14px system-ui;
        color: #27354b;
      "
    >
      <h2 id="fixture-alert-title" style="font-size: 20px"></h2>
      <p id="fixture-alert-body" style="line-height: 1.6"></p>
      <form method="dialog" style="display: flex; gap: 12px; justify-content: end">
        <button value="cancel">Cancelar</button>
        <button value="confirm" id="fixture-alert-confirm"></button>
      </form>
    </dialog>
    <script>
      const fixtureWidth = Number(new URLSearchParams(location.search).get("viewport"));
      if (fixtureWidth >= 320 && fixtureWidth <= 1920)
        document.body.style.width = `${fixtureWidth}px`;
      let saves = 0;
      let publications = 0;
      let keyChecks = 0;
      const builders = [
        {
          shortName: "builder_agendamento",
          name: "Agendamento",
          template: "builder",
          hasPermission: true,
          tenantId: "test",
        },
        {
          shortName: "builder_suporte",
          name: "Suporte",
          template: "builder",
          hasPermission: true,
          tenantId: "test",
        },
        {
          shortName: "builder_falha",
          name: "Falha de leitura",
          template: "builder",
          hasPermission: true,
          tenantId: "test",
        },
        {
          shortName: "router_test",
          name: "Router não deve aparecer",
          template: "master",
          hasPermission: true,
          tenantId: "test",
        },
        {
          shortName: "sem_acesso",
          name: "Sem acesso",
          template: "builder",
          hasPermission: false,
          tenantId: "test",
        },
        {
          shortName: "router_com_chave",
          name: "Router com chave",
          template: "master",
          hasPermission: true,
          tenantId: "test",
        },
        {
          shortName: "router_sem_chave",
          name: "Router sem chave",
          template: "master",
          hasPermission: true,
          tenantId: "test",
        },
      ];
      window.addEventListener("message", (event) => {
        const frame = document.querySelector("iframe");
        if (event.origin !== location.origin || event.source !== frame.contentWindow) return;
        if (event.data?.fixturePublication) {
          publications++;
          document.querySelector("#fixture-operations").textContent =
            `${saves} salvamentos · ${publications} publicações solicitadas · autor: ${event.data.publicationAuthor || "ausente"}`;
          return;
        }
        if (event.data?.fixtureApply) {
          saves++;
          if (event.data.published) publications++;
          document.querySelector("#fixture-operations").textContent =
            `${saves} salvamentos · ${publications} publicações`;
          return;
        }
        const message = event.data?.message;
        let response;
        if (message?.action === "showAlert" || message?.action === "blipEvent:showAlert") {
          const dialog = document.querySelector("dialog");
          document.querySelector("#fixture-alert-title").textContent = message.content.title;
          document.querySelector("#fixture-alert-body").textContent = message.content.body;
          document.querySelector("#fixture-alert-confirm").textContent =
            message.content.buttons.confirm;
          dialog.returnValue = "";
          dialog.addEventListener(
            "close",
            () => {
              event.source.postMessage(
                {
                  trackingProperties: event.data.trackingProperties,
                  response: dialog.returnValue === "confirm",
                },
                event.origin,
              );
            },
            { once: true },
          );
          dialog.showModal();
          return;
        } else if (message?.action === "blipEvent:getApplication")
          response = { shortName: "router_test", name: "Router de teste", tenantId: "test" };
        else if (message?.action === "blipEvent:getAccount")
          response = {
            identity: "test@example.com",
            email: document.querySelector("#fixture-account").value,
          };
        else if (message?.action === "blipEvent:sendCommand") {
          const uri = message.content.command.uri;
          if (uri.endsWith("/whatsapp-flows/public-key/upload")) {
            keyChecks++;
            document.querySelector("#fixture-key-checks").textContent =
              `${keyChecks} consultas de public key · ${message.content.command.from}`;
            const mode = document.querySelector("#fixture-public-key").value;
            const present =
              mode === "present" || (mode === "per-router" && !uri.includes("router_sem_chave"));
            response =
              mode === "error"
                ? {
                    status: "failure",
                    reason: { code: 13, description: "Sem permissão (fictício)" },
                  }
                : {
                    status: "success",
                    resource: {
                      data: present
                        ? [
                            {
                              business_public_key: "fixture-public-key",
                              business_public_key_signature_status: "VALID",
                            },
                          ]
                        : [],
                    },
                    metadata: { "#command.uri": uri },
                  };
          } else if (uri.includes("/users/"))
            response = { status: "success", resource: { roleId: "admin" } };
          else if (uri.endsWith("/applications") || uri.startsWith("/applications?"))
            response = { status: "success", resource: { items: builders } };
          else if (uri.startsWith("/applications/"))
            response = {
              status: "success",
              resource: {
                shortName: uri.split("/").pop().split("@")[0],
                accessKey: btoa("fake-local-key"),
              },
            };
          else response = { status: "success", resource: {} };
        } else if (message?.action === "blipEvent:heightChange") {
          if (Number.isFinite(message.content)) frame.style.height = `${message.content}px`;
          return;
        } else return;
        event.source.postMessage(
          { trackingProperties: event.data.trackingProperties, response },
          event.origin,
        );
      });
    </script>
  </body>
</html>
